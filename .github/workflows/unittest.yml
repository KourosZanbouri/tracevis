name: UnitTest

on:
  pull_request:
  push:

jobs:
  unittest:
    runs-on: ubuntu-latest
    name: Run UnitTests
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          # Pinned: the geolocate multipath probe needs 3.14's multiprocessing
          # (the nested-function pickle bug is only fixed there), and the
          # Dockerfile ships python:3.14-slim. A bare `3` would silently drift.
          python-version: '3.14'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Launch tests
        run: python -m unittest discover test
